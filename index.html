<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7fd4ff" />
<title>Reading Buddies — Digraphs &amp; Sight Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
</head>
<body>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <header class="topbar">
    <button class="icon-btn" id="homeBtn" title="Home" aria-label="Go home">🏠</button>
    <div class="brand">
      <span class="brand-emoji" id="mascotMini">🦉</span>
      <span class="brand-text">Reading Buddies</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="soundBtn" title="Sound on/off" aria-label="Toggle sound">🔊</button>
      <div class="score-pill" id="scorePill" title="Stars earned">⭐ <span id="starCount">0</span></div>
    </div>
  </header>

  <main id="screen" class="app" aria-live="polite"></main>

  <div class="mascot-bar" id="mascotBar">
    <div class="mascot-face" id="mascotFace">🦉</div>
    <div class="speech-bubble" id="speechBubble">Hi! I'm Ollie. Let's learn to read!</div>
  </div>

  <script src="data.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
